name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[01]\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a v0 or v1 release tag such as v0.1.0" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          test "$(go list -m)" = "github.com/pecodaty/k8dex"
      - run: go test -race -shuffle=on ./...
      - run: make verify-generated
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
      - name: Index public Go module
        env:
          GOPROXY: https://proxy.golang.org
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3; do
            if go list -m "github.com/pecodaty/k8dex@$RELEASE_TAG"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
