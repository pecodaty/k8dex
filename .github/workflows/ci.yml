name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true
      - run: go test -race -shuffle=on ./...
      - run: make verify-generated
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
