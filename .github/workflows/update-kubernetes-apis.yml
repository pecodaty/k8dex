name: Update Kubernetes APIs

on:
  workflow_dispatch:
    inputs:
      kubernetes-version:
        description: Kubernetes release tag, for example v1.35.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      K8S_VERSION: ${{ inputs.kubernetes-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true
      - run: make update-apis KUBERNETES_VERSION="$K8S_VERSION"
      - run: make verify-generated
      - run: go test -race -shuffle=on ./...
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/kubernetes-${{ inputs.kubernetes-version }}
          delete-branch: true
          commit-message: Update Kubernetes APIs to ${{ inputs.kubernetes-version }}
          title: Update Kubernetes APIs to ${{ inputs.kubernetes-version }}
          body: Generated from the official tagged Kubernetes OpenAPI source. Review the matching api-changes report before merging.
